# ============================================================================
# VMPacker CI build — CLI + Wails GUI
#
# jobs:
#   * build-cli   — 编译 VM 解释器 stub → 生成 vm_interp.bin → 构建 Windows/Linux
#                   CLI → 冒烟测试（demo_license）→ 上传 vmpacker.exe / vmpacker /
#                   vm-interp-blob（GUI job 复用）
#   * build-gui   — Wails v2 GUI（Windows）：复用 vm-interp-blob 放到
#                   vmp-gui/backend/api/vm_interp.bin（engine.go go:embed）→
#                   前端 npm build → MSYS2 gcc（wails CGO 需要）→ wails build
#                   → 上传 vmp-gui.exe
#
# 触发：手动 workflow_dispatch，或 push 到 main/master 且改动相关源码
# ============================================================================
name: Build vmpacker CLI + GUI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'stub/**'
      - 'vmp-gui/**'
      - 'Makefile'
      - 'go.mod'
      - '.github/workflows/build.yml'

jobs:
  # ==========================================================================
  # 1) CLI（原作业，保持不动）
  # ==========================================================================
  build-cli:
    name: Build stub + CLI + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 交叉编译工具链 ----------
      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ---------- 1) 编译 VM 解释器 blob ----------
      - name: Compile VM interpreter stub
        run: |
          mkdir -p build/stub
          aarch64-linux-gnu-gcc \
            -c -Os -mcmodel=tiny -fno-stack-protector \
            -fno-builtin -nostdlib -march=armv8-a \
            -DVM_INDIRECT_DISPATCH -DVM_FUNC_SPLIT -DVM_TOKEN_ENTRY \
            stub/linux/arm64/vm_interp.c -o build/stub/vm_interp.o

          aarch64-linux-gnu-ld -T stub/linux/arm64/vm_interp.lds \
            -o build/stub/vm_interp.elf build/stub/vm_interp.o

          aarch64-linux-gnu-objcopy -O binary \
            build/stub/vm_interp.elf build/vm_interp_raw.bin

      - name: Generate vm_interp.bin (symbol header + raw blob)
        run: |
          python3 - <<'PYEOF'
          import struct, subprocess
          nm = subprocess.check_output(
              ['aarch64-linux-gnu-nm', 'build/stub/vm_interp.elf']
          ).decode()

          def find_sym(name):
              for line in nm.splitlines():
                  parts = line.split()
                  if len(parts) >= 3 and parts[2] == name:
                      return int(parts[0], 16)
              raise RuntimeError(f'symbol {name} not found')

          hdr  = struct.pack('<QQQ',
                             find_sym('vm_entry'),
                             find_sym('vm_entry_token'),
                             find_sym('_token_table_va'))
          raw  = open('build/vm_interp_raw.bin', 'rb').read()
          blob = hdr + raw
          # go:embed 需要的路径：必须正好是 cmd/vmpacker/vm_interp.bin
          open('cmd/vmpacker/vm_interp.bin', 'wb').write(blob)
          print(f'[+] cmd/vmpacker/vm_interp.bin: {len(blob)} bytes')
          PYEOF

      # ---------- 2) 构建 CLI（Windows + Linux） ----------
      - name: Build Windows CLI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o vmpacker.exe ./cmd/vmpacker/

      - name: Build Linux CLI
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-s -w' -o vmpacker ./cmd/vmpacker/

      # ---------- 3) 冒烟测试：真实打包一次 ----------
      - name: Smoke test (protect demo_license)
        run: |
          chmod +x vmpacker
          aarch64-linux-gnu-gcc -static -O0 -march=armv8-a \
            demo/demo_license.c -o build/demo_license

          ./vmpacker -info build/demo_license
          ./vmpacker -func check_license -o build/demo_license.vmp build/demo_license
          test -s build/demo_license.vmp && echo "[+] smoke OK: demo_license.vmp"

      # ---------- 4) 上传产物 ----------
      - name: Upload vmpacker.exe (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: vmpacker-windows
          path: vmpacker.exe
          if-no-files-found: error

      - name: Upload vmpacker (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: vmpacker-linux
          path: vmpacker
          if-no-files-found: error

      - name: Upload vm_interp.bin
        uses: actions/upload-artifact@v4
        with:
          name: vm-interp-blob
          path: cmd/vmpacker/vm_interp.bin
          if-no-files-found: error

  # ==========================================================================
  # 2) GUI（Wails v2，Windows）——依赖 build-cli 的 vm_interp.bin
  # ==========================================================================
  build-gui:
    name: Build Wails GUI (vmp-gui.exe)
    needs: build-cli
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 复用 CLI job 生成的解释器 blob ----------
      - name: Download vm_interp.bin (from build-cli)
        uses: actions/download-artifact@v4
        with:
          name: vm-interp-blob
          path: blob

      - name: Place blob where the GUI backend embeds it
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vmp-gui/backend/api | Out-Null
          Copy-Item blob/vm_interp.bin vmp-gui/backend/api/vm_interp.bin -Force
          Get-Item vmp-gui/backend/api/vm_interp.bin | Select-Object Name, Length

      - uses: actions/setup-go@v5
        with:
          go-version-file: vmp-gui/go.mod
          cache: true

      # ---------- Wails 在 Windows 编译需要 gcc（CGO） ----------
      - name: Setup MSYS2 toolchain (mingw gcc for wails)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      # ---------- 前端（Vite + Vue，wails 内嵌 frontend/dist） ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: vmp-gui/frontend/package-lock.json

      - name: Build frontend
        working-directory: vmp-gui/frontend
        shell: bash
        run: |
          npm install
          npm run build
          ls -la dist/

      # ---------- wails build（msys2 shell 里跑，保证 gcc 在 PATH） ----------
      - name: Build vmp-gui.exe (wails)
        shell: msys2 {0}
        working-directory: vmp-gui
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0 build -trimpath

      - name: Upload vmp-gui.exe
        uses: actions/upload-artifact@v4
        with:
          name: vmp-gui-windows
          path: vmp-gui/build/bin/vmp-gui.exe
          if-no-files-found: error